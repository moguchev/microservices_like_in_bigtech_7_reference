syntax = "proto3";

package api.users.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "users/pkg/api/users/v1;user";

// CreateProfileRequest - запрос на создание профиля
message CreateProfileRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "CreateProfileRequest"
      description: "Запрос на создание профиля пользователя"
      required: [
        "user_id",
        "nickname"
      ]
    }
  };

  // Id пользователя
  string user_id = 1 [
    json_name = "user_id",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "user_id"
      description: "Id пользователя"
      example: "\"123e4567-e89b-12d3-a456-426614174000\""
      type: STRING
    }
  ];

  // Никнейм
  string nickname = 2 [
    json_name = "nickname",
    (buf.validate.field).string.pattern = "^[a-z0-9_]{3,20}$",
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "nickname"
      description: "Никнейм пользователя"
      example: "\"john_doe\""
      type: STRING
    }
  ];

  // Биография
  string bio = 3 [
    json_name = "bio",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "bio"
      description: "Биография пользователя"
      example: "\"Люблю программировать\""
      type: STRING
    }
  ];

  // URL аватара
  string avatar_url = 4 [
    json_name = "avatar_url",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "avatar_url"
      description: "URL аватара пользователя"
      example: "\"https://example.com/avatar.png\""
      type: STRING
    }
  ];
}

// CreateProfileResponse - ответ на создание профиля
message CreateProfileResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "CreateProfileResponse"
      description: "Ответ на создание профиля пользователя"
    }
  };

  // Созданный профиль
  UserProfile profile = 1 [json_name = "profile"];
}

