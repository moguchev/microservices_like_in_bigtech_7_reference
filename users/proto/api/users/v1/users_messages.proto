// SearchByNicknameRequest - запрос поиска пользователей по никнейму
message SearchByNicknameRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "SearchByNicknameRequest"
      description: "Запрос на поиск пользователей по никнейму"
      required: ["query"]
    }
  };

  // Поисковый запрос
  string query = 1 [
    json_name = "query",
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "query"
      description: "Поисковый запрос для никнейма"
      example: "\"john\""
      type: STRING
    }
  ];

  // Лимит количества результатов
  int32 limit = 2 [
    json_name = "limit",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "limit"
      description: "Лимит количества результатов"
      example: "20"
      type: INTEGER
    }
  ];
}

// SearchByNicknameResponse - ответ поиска пользователей по никнейму
message SearchByNicknameResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "SearchByNicknameResponse"
      description: "Ответ на поиск пользователей по никнейму"
    }
  };

  // Список найденных профилей
  repeated UserProfile results = 1 [json_name = "results"];
}

// UserProfile - структура профиля пользователя
message UserProfile {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "UserProfile"
      description: "Структура профиля пользователя"
    }
  };

  // Id пользователя
  string user_id = 1 [
    json_name = "user_id",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "user_id"
      description: "Id пользователя"
      example: "\"123e4567-e89b-12d3-a456-426614174000\""
      type: STRING
    }
  ];

  // Никнейм
  string nickname = 2 [
    json_name = "nickname",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "nickname"
      description: "Никнейм пользователя"
      example: "\"john_doe\""
      type: STRING
    }
  ];

  // Биография
  string bio = 3 [
    json_name = "bio",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "bio"
      description: "Биография пользователя"
      example: "\"Люблю программировать\""
      type: STRING
    }
  ];

  // URL аватара
  string avatar_url = 4 [
    json_name = "avatar_url",
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "avatar_url"
      description: "URL аватара пользователя"
      example: "\"https://example.com/avatar.png\""
      type: STRING
    }
  ];
}
